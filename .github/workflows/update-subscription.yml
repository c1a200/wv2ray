name: Update V2ray Subscription

concurrency:
  group: update-subscription
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
  HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
  ALL_PROXY: ${{ secrets.ALL_PROXY }}
  NO_PROXY: 'subconverter-jboo.onrender.com,proxy-manager-ggeu.onrender.com,api.github.com,github.com'
  SUBCONVERTER_URL: 'https://subconverter-jboo.onrender.com/'
  SUBCONVERTER_TARGET_V2RAY: 'mixed'
  SUBCONVERTER_TARGET_CLASH: 'clash'
  SUBCONVERTER_SOURCE_TARGET: 'clash'
  SUBCONVERTER_SOURCE_LIST: 'true'
  SUBCONVERTER_RETRY_ATTEMPTS: '3'
  SUBCONVERTER_RETRY_WAIT_SECONDS: '60'
  SUBCONVERTER_INSERT: 'false'
  SUBCONVERTER_EMOJI: 'true'
  SUBCONVERTER_LIST: 'false'
  FETCH_EXTRA_HEADERS_JSON: ${{ vars.FETCH_EXTRA_HEADERS_JSON || '' }}
  USE_DIRECT_SOURCE: ${{ vars.USE_DIRECT_SOURCE || 'true' }}
  DIRECT_V2RAY_URL: ${{ vars.DIRECT_V2RAY_URL || 'https://node.zyfx6.xyz/v2rayNG/' }}
  DIRECT_CLASH_URL: ${{ vars.DIRECT_CLASH_URL || 'https://node.zyfx6.xyz/clash' }}

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 23,6 * * *'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip fetching upstream and deploy the current docs directory only'
        required: false
        default: false
        type: boolean

jobs:
  update:
    runs-on: ${{ fromJSON(vars.FETCH_RUNNER_LABELS || '["ubuntu-latest"]') }}

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Show runner context
        run: |
          echo "runner_name=${{ runner.name }}"
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          echo "FETCH_RUNNER_LABELS=${{ vars.FETCH_RUNNER_LABELS || '[\"ubuntu-latest\"]' }}"

      - name: Install dependencies
        if: ${{ !inputs.deploy_only }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update subscription
        if: ${{ !inputs.deploy_only }}
        run: python src/update_subscription.py
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          DEBUG_FETCH: 'true'

      - name: Create index page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>V2ray Subscription</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 32px; color: #222; }
                  code { background: #f3f3f3; padding: 4px 8px; border-radius: 4px; }
                  .box { margin: 16px 0; padding: 16px; border: 1px solid #ddd; border-radius: 6px; }
              </style>
          </head>
          <body>
              <h1>V2ray Subscription</h1>
              <div class="box">
                  <div>V2ray:</div>
                  <code>https://c1a200.github.io/wv2ray/subscribe.txt</code>
              </div>
              <div class="box">
                  <div>Clash:</div>
                  <code>https://c1a200.github.io/wv2ray/clash.yaml</code>
              </div>
          </body>
          </html>
          EOF
          echo "index.html generated"

      - name: Check files
        run: |
          echo "docs directory:"
          ls -lah docs/
          echo ""
          echo "file sizes:"
          du -sh docs/*

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ -n "$(git status --porcelain)" ]; then
              git add docs/
              git add src/
              git commit -m "auto update subscription - $(date +'%Y-%m-%d %H:%M:%S')" || true
              git push origin main || git push origin master || echo "Push failed"
          else
              echo "No changes, skipping commit"
          fi

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs'

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "workflow version: 2026-03-15-1"
          echo "Update complete"
          echo ""
          echo "Fetch runner labels: ${{ vars.FETCH_RUNNER_LABELS || '[\"ubuntu-latest\"]' }}"
          echo ""
          echo "Subscribe URL:"
          echo "https://c1a200.github.io/wv2ray/subscribe.txt"
