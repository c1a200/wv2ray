name: Update V2ray Subscription

on:
  schedule:
    - cron: '0 7,14 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update subscription
        run: python src/update_subscription.py
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          DEBUG_FETCH: 'true'

      - name: Create index page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>V2ray Subscription</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 32px; color: #222; }
                  code { background: #f3f3f3; padding: 4px 8px; border-radius: 4px; }
                  .box { margin: 16px 0; padding: 16px; border: 1px solid #ddd; border-radius: 6px; }
              </style>
          </head>
          <body>
              <h1>V2ray Subscription</h1>
              <div class="box">
                  <div>V2ray:</div>
                  <code>https://c1a200.github.io/wv2ray/subscribe.txt</code>
              </div>
              <div class="box">
                  <div>Clash:</div>
                  <code>https://c1a200.github.io/wv2ray/clash.yaml</code>
              </div>
          </body>
          </html>
          EOF
          echo "index.html generated"

      - name: Check files
        run: |
          echo "docs directory:"
          ls -lah docs/
          echo ""
          echo "file sizes:"
          du -sh docs/*

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ -n "$(git status --porcelain)" ]; then
              git add docs/
              git add src/
              git commit -m "auto update subscription - $(date +'%Y-%m-%d %H:%M:%S')" || true
              git push origin main || git push origin master || echo "Push failed"
          else
              echo "No changes, skipping commit"
          fi

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "workflow version: 2026-02-25-1"
          echo "Update complete"
          echo ""
          echo "Subscribe URL:"
          echo "https://c1a200.github.io/wv2ray/subscribe.txt"
