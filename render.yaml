services:
  - type: web
    name: wv2ray
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GENERATE_ISSUE_VARIANTS
        value: "false"
      - key: SUBCONVERTER_TARGET_V2RAY
        value: mixed
      - key: SUBCONVERTER_TARGET_CLASH
        value: clash
      - key: REFRESH_INTERVAL_SECONDS
        value: "86400"
      - key: DATA_DIR
        value: /tmp/wv2ray
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEBDAV_URL
        sync: false
      - key: WEBDAV_USERNAME
        sync: false
      - key: WEBDAV_PASSWORD
        sync: false
