<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理登录</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}body{max-width:420px;margin:12vh auto;padding:0 18px}main{background:#fff;border:1px solid #dbe3ef;border-radius:8px;padding:28px}input,button{box-sizing:border-box;width:100%;padding:11px;margin-top:12px;font:inherit}button{border:0;border-radius:5px;background:#1463d8;color:#fff;cursor:pointer}.error{color:#b42318}</style></head><body><main><h1>管理登录</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input name="password" type="password" autocomplete="current-password" required autofocus placeholder="管理密码"><button type="submit">进入设置</button></form></main></body></html>
